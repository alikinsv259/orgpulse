services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - path: .env
        required: false
      - path: apps/server/.env
        required: false
    environment:
      PORT: 4001
    expose:
      - "4001"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped
