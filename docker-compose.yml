services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 4001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      LATENCY_MS: ${LATENCY_MS:-0}
      LIVE_INTERVAL_MS: ${LIVE_INTERVAL_MS:-3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_SEARCH_MODEL: ${AI_SEARCH_MODEL:-gpt-4o-mini}
    expose:
      - "4001"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped
